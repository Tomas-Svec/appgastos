<ion-header>
  <ion-toolbar class="income-toolbar">
    <ion-title>Presupuesto Mensual</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding income-content">
  <!-- Modal Handle (estilo iOS) -->
  <div class="modal-handle"></div>

  <h2 class="modal-title">Define tu presupuesto</h2>
  <p class="modal-subtitle">Ingresa el dinero disponible para este mes</p>

  <!-- Error Message -->
  @if (errorMessage) {
    <div class="error-message">
      <ion-icon name="alert-circle-outline"></ion-icon>
      <span>{{ errorMessage }}</span>
    </div>
  }

  <form class="income-form">
    <!-- Amount Input -->
    <div class="amount-input-wrapper">
      <div class="currency-symbol">$</div>
      <ion-input
        [(ngModel)]="incomeDisplay"
        name="income"
        type="text"
        class="large-amount-input"
        [placeholder]="incomeFormatted || '0'"
        inputmode="numeric"
        (ionFocus)="onIncomeFocus()"
        (ionInput)="onIncomeInput($event)"
        [disabled]="isLoading">
      </ion-input>
    </div>
    <!-- Buttons -->
    <div class="button-group">
      <ion-button
        expand="block"
        class="ios-button-large save-button"
        (click)="saveIncome()"
        [disabled]="isLoading || !monthlyIncome || monthlyIncome <= 0">
        @if (isLoading) {
          <ion-spinner name="crescent"></ion-spinner>
          <span>Guardando...</span>
        } @else {
          <span>Guardar Presupuesto</span>
        }
      </ion-button>

      <ion-button
        expand="block"
        fill="clear"
        class="cancel-button"
        (click)="dismiss()"
        [disabled]="isLoading">
        Cancelar
      </ion-button>
    </div>
  </form>
</ion-content>
